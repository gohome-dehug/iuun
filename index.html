<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하윤의 바탕화면</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.woff">
    <style>
        @font-face {
            font-family: 'NeoDunggeunmo';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/NeoDunggeunmo.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --main-white: #FFFFFF;
            --soft-blue: #C6E7FF;
            --soft-green: #76C457;
            --win-border-dark: #848484;
            --win-bg: rgba(255, 255, 255, 0.88);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'NeoDunggeunmo', 'Courier New', monospace, sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: linear-gradient(to bottom, #a8d8ff 0%, #c6e7ff 50%, #e8f5e9 80%, #76c457 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            transition: background 1.5s ease, color 1.5s ease;
            position: relative;
            padding-bottom: 60px;
        }

        /* 👁️ 배경 형체 (Shadow Entity) */
        #bg-entity {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, rgba(0,0,0,0.9) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: all 2s ease;
            filter: blur(20px);
        }

        /* 👁️ 흑화 모드 스타일 (빨간 테두리 + 검은 배경 + 글씨 깨짐) */
        body.horro-mode {
            background: #000000 !important;
            color: #ef4444 !important;
        }

        body.horro-mode #bg-entity {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
        }

        body.horro-mode .win-box {
            background: #050505 !important;
            border: 3px solid #ef4444 !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4) !important;
            color: #ef4444 !important;
        }

        body.horro-mode .win-header {
            background: #500000 !important;
            color: #ff8888 !important;
            border-bottom: 2px solid #ef4444 !important;
        }

        /* 글씨 깨짐 및 왜곡 효과 */
        body.horro-mode h1, 
        body.horro-mode h2, 
        body.horro-mode p, 
        body.horro-mode span, 
        body.horro-mode li,
        body.horro-mode div {
            animation: textGlitch 0.15s infinite alternate;
        }

        @keyframes textGlitch {
            0% { transform: skew(0deg); opacity: 0.9; }
            50% { transform: skew(-3deg) scaleY(1.02); filter: blur(0.5px); }
            100% { transform: skew(3deg); opacity: 1; }
        }

        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 2000;
        }

        #progress-bar {
            height: 100%;
            background: #2563eb;
            width: 0%;
            transition: width 0.1s ease-out;
        }

        header {
            position: fixed;
            top: 4px;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--win-border-dark);
            z-index: 1000;
        }

        body.horro-mode header {
            background: #111;
            border-bottom-color: #ef4444;
        }

        .navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 10px 15px;
            gap: 12px;
        }

        .nav-item {
            background: #ffffff;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #000000;
            text-decoration: none;
        }

        body.horro-mode .nav-item {
            background: #222;
            color: #ef4444;
            border-color: #ef4444 #500000 #500000 #ef4444;
        }

        main {
            max-width: 850px;
            width: 90%;
            margin: 100px auto 80px auto;
            display: flex;
            flex-direction: column;
            gap: 80px;
            position: relative;
            z-index: 2;
        }

        .win-box {
            background: var(--win-bg);
            border: 2px solid #ffffff;
            box-shadow: 6px 6px 20px rgba(0, 0, 0, 0.12);
            border-radius: 4px;
            overflow: hidden;
            transition: all 1.5s ease;
        }

        .win-header {
            background: linear-gradient(90deg, var(--soft-blue), #9be1a0);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #222;
            font-weight: bold;
            border-bottom: 1px solid #b0b0b0;
        }

        .win-title { display: flex; align-items: center; gap: 6px; font-size: 0.95rem; }
        .win-controls { display: flex; gap: 4px; }
        .win-btn {
            width: 18px; height: 16px; background: #e0e0e0;
            border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff;
            font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .win-btn.close-btn:hover { background: #ef4444; color: white; }

        .win-content { padding: 30px; line-height: 1.8; }
        .home-center { text-align: center; padding: 40px 10px; }
        .home-title { font-size: 1.7rem; color: #1e293b; margin-bottom: 20px; }
        .home-sub { font-size: 1.1rem; color: #475569; background: rgba(255, 255, 255, 0.7); display: inline-block; padding: 8px 18px; border-radius: 20px; border: 1px dashed var(--soft-green); }
        body.horro-mode .home-sub { background: #222; color: #ef4444; border-color: #ef4444; }

        h2 { font-size: 1.4rem; margin-bottom: 20px; color: #1e293b; border-bottom: 2px dashed var(--soft-green); padding-bottom: 8px; }
        body.horro-mode h2 { color: #ef4444; border-bottom-color: #ef4444; }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #d1d5db;
            padding: 18px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        body.horro-mode .card { background: #111; border-color: #ef4444; color: #ef4444; }

        .card-list { list-style: none; padding: 0; }
        .card-list li { position: relative; padding-left: 20px; margin-bottom: 10px; }
        .card-list li::before { content: '✦'; position: absolute; left: 0; color: #76C457; }
        body.horro-mode .card-list li::before { content: '👁️'; color: #ef4444; }

        .pet-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: #f0f9ff;
            border: 2px inset #b0c4de;
            padding: 20px;
            border-radius: 8px;
        }
        body.horro-mode .pet-container { background: #0a0508; border-color: #ef4444; }

        .pet-screen {
            width: 280px; height: 200px; background: #e0f2fe;
            border: 4px solid #38bdf8; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
        }
        body.horro-mode .pet-screen { background: #030712; border-color: #ef4444; }

        .pet-dialog {
            position: absolute; top: 10px; font-size: 0.85rem; background: #ffffff;
            padding: 4px 12px; border-radius: 10px; border: 1px solid #0284c7; color: #0369a1; text-align: center;
        }
        body.horro-mode .pet-dialog { background: #180505; border-color: #ef4444; color: #ff8888; }

        .dolphin-canvas { width: 120px; height: 80px; display: flex; justify-content: center; align-items: center; }
        .dolphin-pixel { font-size: 70px; line-height: 1; user-select: none; }

        .pet-stats { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .stat-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.9rem; }
        .stat-bar-bg { width: 60%; height: 14px; background: #e2e8f0; border-radius: 7px; overflow: hidden; border: 1px solid #cbd5e1; }
        body.horro-mode .stat-bar-bg { background: #260505; border-color: #ef4444; }

        .stat-bar-fill { height: 100%; width: 70%; transition: width 0.3s ease; }
        #satiety-fill { background-color: #f59e0b; }
        #cleanliness-fill { background-color: #3b82f6; }
        #energy-fill { background-color: #10b981; }
        body.horro-mode .stat-bar-fill { background-color: #ef4444 !important; }

        .pet-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .pet-action-btn {
            background: #ffffff; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
            padding: 8px 16px; font-size: 0.95rem; cursor: pointer;
        }
        body.horro-mode .pet-action-btn { background: #222; color: #ef4444; border-color: #ef4444 #500000 #500000 #ef4444; }

        footer {
            background: rgba(255, 255, 255, 0.95); border-top: 2px solid var(--win-border-dark);
            padding: 8px 20px; font-size: 0.85rem; display: flex; justify-content: space-between;
            align-items: center; position: fixed; bottom: 0; width: 100%; z-index: 1000;
        }
        body.horro-mode footer { background: #000; border-top-color: #ef4444; color: #ef4444; }

        .start-btn {
            background: #e0e0e0; border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
            padding: 3px 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        body.horro-mode .start-btn { background: #222; color: #ef4444; border-color: #ef4444 #500000 #500000 #ef4444; }

        .system-tray { display: flex; align-items: center; gap: 8px; position: relative; }
        .settings-btn { background: #e0e0e0; border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff; font-size: 10px; padding: 2px 6px; cursor: pointer; }
        body.horro-mode .settings-btn { background: #222; color: #ef4444; border-color: #ef4444 #500000 #500000 #ef4444; }

        .settings-popup {
            position: absolute; bottom: 35px; right: 0; background: #ffffff; border: 2px solid #848484;
            padding: 12px; width: 220px; display: none; flex-direction: column; gap: 8px; z-index: 1100;
        }
        body.horro-mode .settings-popup { background: #111; border-color: #ef4444; color: #ef4444; }
        .settings-popup.active { display: flex; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }

        /* 🚪 검은 문 (돌고래 창을 닫았을 때 등장) */
        #black-door {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 180px; background: #000; border: 3px solid #ef4444;
            display: none; cursor: pointer; z-index: 100; align-items: center; justify-content: center;
            box-shadow: 0 0 20px #ef4444;
        }

        /* 💻 블루스크린 */
        #bsod-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0078d7; color: #ffffff; padding: 10%; display: none;
            flex-direction: column; justify-content: center; z-index: 99999;
        }
    </style>
</head>
<body>

    <div id="bg-entity"></div>

    <!-- 🚪 검은 문 -->
    <div id="black-door" onclick="triggerBSODSequence()">
        <span style="color: #ef4444; font-size: 0.8rem;">ENTER</span>
    </div>

    <!-- 💻 블루스크린 화면 -->
    <div id="bsod-screen">
        <h1 style="font-size: 80px; font-weight: normal; margin-bottom: 20px;">:(</h1>
        <p style="font-size: 22px; line-height: 1.5;">PC에 문제가 발생하여 다시 시작해야 합니다.</p>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <header>
        <nav class="navbar">
            <a href="#home" class="nav-item">🏠 Home</a>
            <a href="#profile" class="nav-item">👤 Profile</a>
            <a href="#projects" class="nav-item">💻 Projects</a>
            <a href="#playlab" class="nav-item">🎬 Play Lab</a>
        </nav>
    </header>

    <main>
        <section id="home" class="win-box">
            <div class="win-header">
                <div class="win-title">💾 Welcome.exe</div>
                <div class="win-controls"><div class="win-btn close-btn" onclick="closeWindow(this)">X</div></div>
            </div>
            <div class="win-content home-center">
                <h1 class="home-title">바탕화면에 오신것을 환영합니다</h1>
                <div class="home-sub">하윤의 개인 컴퓨터입니다!</div>
            </div>
        </section>

        <section id="playlab" class="win-box">
            <div class="win-header">
                <div class="win-title">🎬 PlayLab_DolphinHelper.exe</div>
                <div class="win-controls"><div class="win-btn close-btn" onclick="closeWindow(this)">X</div></div>
            </div>
            <div class="win-content">
                <h2>🎬 Play Lab - 돌고래 키우기</h2>
                <div class="pet-container">
                    <div class="pet-screen">
                        <div id="pet-dialog" class="pet-dialog">큐우-! 안녕!</div>
                        <div class="dolphin-canvas">
                            <div id="dolphin-char" class="dolphin-pixel">🐬</div>
                        </div>
                    </div>

                    <div class="pet-stats">
                        <div class="stat-row">
                            <span>🐟 배부름</span>
                            <div class="stat-bar-bg"><div id="satiety-fill" class="stat-bar-fill"></div></div>
                        </div>
                        <div class="stat-row">
                            <span>🧼 청결도</span>
                            <div class="stat-bar-bg"><div id="cleanliness-fill" class="stat-bar-fill"></div></div>
                        </div>
                        <div class="stat-row">
                            <span>💤 체력</span>
                            <div class="stat-bar-bg"><div id="energy-fill" class="stat-bar-fill"></div></div>
                        </div>
                    </div>

                    <div class="pet-controls">
                        <button class="pet-action-btn" onclick="feedPet()">🐟 먹이주기</button>
                        <button class="pet-action-btn" onclick="cleanPet()">🧼 씻기기</button>
                        <button class="pet-action-btn" onclick="sleepPet()">💤 재우기</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="start-btn" onclick="resetToNormal()"><span>☁️</span> 시작 (Reset)</div>
        <div class="system-tray">
            <button class="settings-btn" onclick="toggleSettings()">▲</button>
            <span>OS v2.0 | <span id="clock">00:00 AM</span></span>
            <div id="settings-popup" class="settings-popup">
                <div style="font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-bottom: 6px;">⚙️ 설정</div>
                <div class="setting-row">
                    <span>공포모드 켜기</span>
                    <input type="checkbox" id="toggle-horror" onchange="toggleHorrorSetting(this.checked)">
                </div>
            </div>
        </div>
    </footer>

    <script>
        let isHorrorEnabled = false;
        let isHorrorMode = false;
        let petStats = { satiety: 70, cleanliness: 70, energy: 70 };

        function toggleSettings() {
            document.getElementById('settings-popup').classList.toggle('active');
        }

        function toggleHorrorSetting(enabled) {
            isHorrorEnabled = enabled;
            if (enabled) {
                triggerHorrorMode();
            } else {
                resetToNormal();
            }
        }

        function updateClock() {
            const now = new Date();
            let h = now.getHours(), m = now.getMinutes();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            m = m < 10 ? '0' + m : m;
            document.getElementById('clock').innerText = `${h}:${m} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 수치 감소 로직 (빠른 속도, 평소엔 15까지만 줄고 멈춤, 공포모드일 땐 0까지 닳음)
        setInterval(() => {
            let minLimit = isHorrorEnabled ? 0 : 15;
            
            petStats.satiety = Math.max(minLimit, petStats.satiety - 5);
            petStats.cleanliness = Math.max(minLimit, petStats.cleanliness - 5);
            petStats.energy = Math.max(minLimit, petStats.energy - 5);
            updatePetUI();

            if (petStats.satiety === 0 && petStats.cleanliness === 0 && petStats.energy === 0) {
                if (!isHorrorMode) {
                    triggerHorrorMode();
                }
            }
        }, 1000);

        function updatePetUI() {
            document.getElementById('satiety-fill').style.width = petStats.satiety + '%';
            document.getElementById('cleanliness-fill').style.width = petStats.cleanliness + '%';
            document.getElementById('energy-fill').style.width = petStats.energy + '%';

            if (petStats.satiety <= 20) {
                document.getElementById('pet-dialog').innerText = "......";
                document.getElementById('dolphin-char').style.filter = "grayscale(100%)";
            }
        }

        function feedPet() { petStats.satiety = Math.min(100, petStats.satiety + 30); updatePetUI(); }
        function cleanPet() { petStats.cleanliness = Math.min(100, petStats.cleanliness + 30); updatePetUI(); }
        function sleepPet() { petStats.energy = Math.min(100, petStats.energy + 30); updatePetUI(); }

        function triggerHorrorMode() {
            isHorrorMode = true;
            document.body.classList.add('horro-mode');
        }

        function resetToNormal() {
            isHorrorMode = false;
            isHorrorEnabled = false;
            document.getElementById('toggle-horror').checked = false;
            document.body.classList.remove('horro-mode');
            document.getElementById('black-door').style.display = 'none';
            document.getElementById('bsod-screen').style.display = 'none';
            
            const err = document.getElementById('error-popup');
            if (err) err.remove();

            petStats = { satiety: 70, cleanliness: 70, energy: 70 };
            document.querySelectorAll('.win-box').forEach(el => el.style.display = 'block');
            updatePetUI();
        }

        // 창 닫기 (플레이랩 창 닫을 때 공포모드면 검은 문 등장)
        function closeWindow(btn) {
            const box = btn.closest('.win-box');
            if (box) {
                box.style.display = 'none';
                if (box.id === 'playlab' && isHorrorMode) {
                    document.getElementById('black-door').style.display = 'flex';
                }
            }
        }

        // 검은 문 클릭 시: 블루스크린(0.1초) -> 에러창(0.2초) -> 블루스크린 -> 정상 복구
        function triggerBSODSequence() {
            const bsod = document.getElementById('bsod-screen');
            document.getElementById('black-door').style.display = 'none';

            // 1. 블루스크린 0.1초
            bsod.style.display = 'flex';

            setTimeout(() => {
                bsod.style.display = 'none';
                
                // 2. 에러창 0.2초
                showErrorPopup(() => {
                    // 3. 다시 블루스크린 후 정상 복구
                    bsod.style.display = 'flex';
                    setTimeout(() => {
                        resetToNormal();
                    }, 800);
                });

            }, 100);
        }

        function showErrorPopup(callback) {
            const pop = document.createElement('div');
            pop.id = 'error-popup';
            pop.innerHTML = `
                <div style="background:#c0c0c0; border:2px solid; border-color:#fff #000 #000 #fff; width:300px; padding:2px; font-family:monospace;">
                    <div style="background:#000080; color:white; padding:3px; font-weight:bold;">System Error</div>
                    <div style="padding:20px; color:black; text-align:center; font-weight:bold;">
                        ⚠️ Fatal Exception 0xE: 0x0028<br>System memory corrupted.
                    </div>
                </div>
            `;
            pop.style.cssText = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:99999;";
            document.body.appendChild(pop);

            setTimeout(() => {
                pop.remove();
                if (callback) callback();
            }, 200);
        }

        updatePetUI();
    </script>
</body>
</html>
